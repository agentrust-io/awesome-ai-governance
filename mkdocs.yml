site_name: Awesome AI Agent Governance
site_description: A curated list of tools, frameworks, standards, and resources for governing autonomous AI agents
site_url: https://governance.agentrust-io.com
repo_url: https://github.com/agentrust-io/awesome-ai-governance
repo_name: agentrust-io/awesome-ai-governance
edit_uri: edit/main/
docs_dir: .
exclude_docs: |
  .github/
  hooks/
  awesome-copilot-contributions/
  lychee.toml
  LICENSE

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: docs/assets/icon.svg
  favicon: docs/assets/icon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
    - header.autohide
  icon:
    repo: fontawesome/brands/github

hooks:
  # The home page takes site_description; every other page gets a meta
  # description from its first paragraph.
  - hooks/home_description.py
  - hooks/seo.py

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        Awesome AI Agent Governance is a community-curated list of tools,
        frameworks, standards, and research for governing autonomous AI agents.
        It covers policy engines, audit and assurance frameworks, agent identity
        and attestation, risk assessment, observability, and deployment
        guidance. Maintained by AgenTrust alongside its open specifications for
        verifiable AI: Weight Custody Manifest, Agent Manifest, cMCP, cA2A and
        TRACE.
      sections:
        The list:
          - README.md
        Contributing:
          - CONTRIBUTING.md
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentrust-io/awesome-ai-governance
  generator: false

extra_css:
  # Shared AgenTrust editorial design system. Deliberately the only stylesheet:
  # a local override here is how this site drifted to the Material default
  # violet last time. Change the shared file instead.
  # The ?v= matches CSS_VERSION in agentrust-io.github.io tools/site_header.py. Browsers keep these files for hours, so bump it there and here together.
  - https://agentrust-io.com/design-system.css?v=22

nav:
  - List: README.md
  - Sponsors: SPONSORS.md
  - Contributing: CONTRIBUTING.md

extra_javascript:
  # Shared cross-project top navigation (TRACE / Manifest / cMCP / cA2A / ...)
  # The ?v= matches CSS_VERSION in agentrust-io.github.io tools/site_header.py. Browsers keep these files for hours, so bump it there and here together.
  - https://agentrust-io.com/supernav.js?v=22
